name: build
on:
  release:
    types: [released]
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    name: Build package
    uses: ./.github/workflows/_build-package.yml
    with:
      check-prerelease: ${{ github.event_name == 'workflow_dispatch' }}
      cache-package: true
      upload-package: true
      test-files: true
      test-imports: true

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write  # Required for Trusted Publishing (OIDC)
    steps:
    - name: Retrieve cached package
      uses: actions/cache/restore@v4
      id: cache-prolif
      with:
        path: |
          dist/prolif_lite-*.whl
          dist/prolif_lite-*.tar.gz
        key: prolif-lite-${{ runner.os }}-${{ github.sha }}

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
